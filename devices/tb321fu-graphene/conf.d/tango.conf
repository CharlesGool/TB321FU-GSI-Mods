# tango/* 的参数(说明见各补丁 README 的"输入"一节)。
# Tango 的文件和小米的 32 位库都有授权限制,不进仓库,放 private/(已 gitignore)。

# Tango v2.1.0 集成包解出来的目录,里面要有 prebuilts/tango_translator、kernel-module/、EULA.txt
TANGO_PKG=${TANGO_PKG:-$REPO/private/tango/pkg}

# 针对当前内核(6.1.112-android14-11-gd03cb1d7abcd-ab12592111)编出来的 tango32.ko。编法见 patches/required/general/tango/parts/003.kernel-module/README.md
TANGO32_KO=${TANGO32_KO:-$REPO/private/tango/tango32.ko}

# 小米 14 Ultra(Eu 固件 OS3.0.304.0)vendor/lib 里挑出来的 32 位 GPU/gralloc 库,目录结构同 /vendor/lib。清单见 patches/required/general/tango/parts/004.vendor-lib32/manifest.sha256
XIAOMI_LIB32_DIR=${XIAOMI_LIB32_DIR:-$REPO/private/xiaomi-vendor-lib32}

# Tango 日志:off / info / debug。info 以上会写 /data/tango/log,首次上机验证时开,稳定后改 off
TANGO_DEBUG=${TANGO_DEBUG:-info}

# tango32.ko 必须按这个内核发布串编(modinfo vermagic 里的第一段),不一致就拒绝装,免得开机 insmod 失败
TANGO_KERNEL_RELEASE=${TANGO_KERNEL_RELEASE:-6.1.112-android14-11-gd03cb1d7abcd-ab12592111}

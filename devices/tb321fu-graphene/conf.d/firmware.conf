# 原厂固件侧(boot 补丁、主 vbmeta 重签)和 9008 刷机包的参数。
# 底包固件 = 联想 ZUI 17.5.10.170 OPEN(“Android 16”)9008 CRACKED 包(testkey 重签,过 unlocked AVB)。
# 用到 device.conf 前面定义的 GRAPHENE_PROJ、SIGNER、STOCK_DIR、STOCK_FW_DIR、STOCK_VBMETA_SYSTEM、DEVICE、VERSION。

# ---- 签名 ----
AVB_KEY_VBMETA=$SIGNER/pem/testkey_rsa4096.pem

# ---- boot(boot-assemble 和它的贡献者 selinux/kernel-enforcing、kernel-builder-string)----
FW_BOOT_STOCK=$STOCK_FW_DIR/boot.img                 # A16 原厂 boot(sha256 6c3c7c67…)
FW_BOOT_CMDLINE="enforcing=1 selinux=1"
FW_BOOT_KBUILD_FROM=build-user@build-host
FW_BOOT_KBUILD_TO=androidbld@abfarmhost
# 新底包:不复刻任何旧 boot 的逐字节一致,salt 随机、不去重复属性、不核对 boot sha256(真机验证后再钉)。
FW_BOOT_SALT=
FW_BOOT_DROP_DUP_PROPS=0
FW_BOOT_EXPECT_SHA256=

# ---- vbmeta(toolkit/avb_resign.sh)----
FW_VBMETA_STOCK=$STOCK_FW_DIR/vbmeta.img             # A16 原厂 vbmeta(sha256 d4c8b06c…)
FW_VBMETA_IMAGES=(
    dtbo=$STOCK_FW_DIR/dtbo.img
    init_boot=$STOCK_FW_DIR/init_boot.img
    vendor_boot=$STOCK_FW_DIR/vendor_boot.img
    odm=$STOCK_DIR/odm.img
    system_dlkm=$STOCK_DIR/system_dlkm.img
    vendor=$STOCK_DIR/vendor.img
    vendor_dlkm=$STOCK_DIR/vendor_dlkm.img
    vbmeta_system=$STOCK_VBMETA_SYSTEM
)
FW_VBMETA_EXPECT_SHA256=                             # 新底包,真机验证后再钉

# ---- 9008 刷机包 ----
# A16 原厂 9008 包 image/ 解出来的位置(容器本机盘,持久)。要有 super_1..8.img、rawprogram*.xml、dtbo.img。
FLASH9008_STOCK_DIRS=(${FLASH9008_STOCK_DIRS:-/root/gsi-graphene-a16/fw/image})
# LUN0 保数据基准 XML:由 A16 原厂 rawprogram_save_persist_unsparse0.xml 去掉 userdata_*/metadata_* 的
# program 行派生(persist 本就不在其中 = 保留),故保数据版刷机时 userdata/metadata/persist 都不动。
# 清数据版由 make_9008_full 以原厂 save_persist(--allow-wipe)另外生成。保数据升级仅适用于原来就刷本项目;
# 首刷/换系统请用清数据版 flash.bat。本基准尚未真机验证。
FLASH9008_BASE_XML=$STOCK_FW_DIR/rawprogram_keep_data_base_unsparse0.xml
# 以下仅 make_9008_patch.sh(增量保数据包)用;本线还没有上一版,出完整包(make_9008_full.sh)不需要。
# FLASH9008_BASE_VERSION=
# FLASH9008_BASE_IMAGE=
# FLASH9008_BASE_SHA256=
FLASH9008_XDELTA_EXE=$OLD/inputs/tools/xdelta3.exe
# 新固件:boot 集和用户手里的原厂不一样,完整包里要带上 boot 集。
FLASH9008_INCLUDE_BOOT_SET=1

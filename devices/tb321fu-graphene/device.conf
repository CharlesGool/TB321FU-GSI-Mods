# TB321FU(拯救者 Y700 三代)+ GrapheneOS Android 17 GSI 的构建配置。
# GSI 来源:GrapheneOS tangorpro(Pixel Tablet)install 包 2026110200(Android 17 / API 37,
# security_patch 2026-11-01,build id CP3A.261005.002.A1),经本仓库自带流程(simg2img 重组 super
# + MysticGSI 合并 system/system_ext/product → raw ext4 GSI)转出。
# vendor/boot 底包:联想 ZUI 17.5.10.170 OPEN(“Android 16”)9008 包。
# 路径都是本机/容器路径;大文件和私有文件不进仓库,放在本工程 inputs/ 和 ap3a 共享件里。

DEVICE=TB321FU
VERSION=${VERSION:-V1}
# 产物名:<IMAGE_PREFIX>_<版本标签>[_optional][_debug](toolkit/build.sh 按这次选择算)。
IMAGE_PREFIX=grapheneos_tangorpro_17_2026110200

# 数据工程(共享 signer/tools/legacy)= ap3a 工程(本仓库平级);可用 TB321FU_DATA 覆盖。
OLD=${TB321FU_DATA:-$(cd "${REPO:?}/../tb321fu_pixelos_15_tangorpro_ap3a.241005.015" && pwd)}
# 本工程目录(inputs: base、base-extracted、base-fw-a16)。
GRAPHENE_PROJ=$(cd "${REPO:?}/../tb321fu_grapheneos_17_tangorpro_2026110200" && pwd)
# 签名密钥(AOSP testkey)目录:GSI_SIGNER 优先;数据工程里有 signer/ 就用它;否则回退到 停更/GSI-Signer。
if [[ -n ${GSI_SIGNER:-} ]]; then SIGNER=$GSI_SIGNER
elif [[ -d $OLD/signer ]]; then SIGNER=$OLD/signer
else SIGNER=$(cd "${REPO:?}/../../停更/GSI-Signer" && pwd); fi

# ---- GSI 底包(GrapheneOS A17) ----
# simg2img(本工程 inputs/base-extracted/_tools/simg2img.py)把 install 包的 15 个 sparse super 分片重组成
# raw super.img,再喂给 MysticGSI(cli.py build --no-debloat,ext4 raw,合并 system_ext/product 进 system)。
# 指纹 ro.system.build.fingerprint=Android/generic_system/generic:17/CP3A.261005.002.A1/2026110200:user/release-keys。
BASE_GSI=${BASE_GSI:-$GRAPHENE_PROJ/inputs/base-extracted/grapheneos-tangorpro-17-2026110200-MysticGSI.img}
BASE_GSI_SHA256=24efe8471b1837e8bbdc92b1b69ef4a015a969a6780d2938aeb758d14ad6528a
# 底包 ID 覆盖:GrapheneOS GSI 的 system 指纹 product 被泛化成 generic_system,会让 required/tangorpro/…
# 版本门控判定“不在适用范围”而跳过。真身是 Pixel Tablet tangorpro(product 分区指纹 google/tangorpro/tangorpro,
# 且带 GrapheneOS Auditor/Vanadium/AppStore),故显式声明门控用的底包 ID。
BASE_ID=tangorpro_graphene_2026110200

# ---- 原厂固件(vendor/boot 底包)= 联想 ZUI 17.5.10.170 OPEN(A16) ----
# 9008 包 image/ 里的 super(8 分片)用 toolkit/flash9008/simsuper.py 切出逻辑分区;boot 集直接取。
# STOCK_DIR 是切出来的逻辑分区(容器本机盘,持久):vendor/system/product/odm/system_dlkm/vendor_dlkm/system_ext.img。
STOCK_DIR=${STOCK_DIR:-/root/gsi-graphene-a16/stock-carved}
STOCK_VENDOR_IMG=$STOCK_DIR/vendor.img
STOCK_SYSTEM_IMG=$STOCK_DIR/system.img
STOCK_FW_DIR=$GRAPHENE_PROJ/inputs/base-fw-a16       # boot/init_boot/vendor_boot/dtbo/vbmeta/vbmeta_system(A16)
STOCK_VBMETA_SYSTEM=$STOCK_FW_DIR/vbmeta_system.img

# ---- 签名 ----
AVBTOOL=${REPO:-.}/toolkit/avb/avbtool.py
AVB_KEY_SYSTEM=$SIGNER/pem/testkey_rsa4096.pem        # 设备信任根就是 AOSP testkey(原厂 OPEN/CRACKED 版也是)
AVB_KEY_VBMETA_SYSTEM=$SIGNER/pem/testkey_rsa2048.pem
# super 里 system_a 的大小(字节)。system 镜像签名后(AVB footer + padding 到此大小)必须正好这么大;
# 9008 打包时 lp.py 把 super 里 system_a extent 缩到这个值(只能 ≤ 原厂 system_a)。
# A16 ZUI 原厂 system_a = 5310480384 字节(lp.py dump 读出);GrapheneOS GSI erofs 远小于它,直接用原厂全尺寸。
SYSTEM_PART_SIZE=5310480384

# ---- 构建工具 ----
APKTOOL_JAR=${APKTOOL_JAR:-$OLD/legacy/faceunlock/incoming/tools/apktool_2.12.1.jar}
R8_JAR=$OLD/inputs/tools/pif-toolchain/r8.jar
ANDROID_JAR=$OLD/inputs/tools/pif-toolchain/android.jar

# ---- 补丁目录 ----
# base-ID 门控的补丁从 dp11(A17)整套复制改名到 required/tangorpro/tangorpro_graphene_2026110200/。
# GrapheneOS 与 Google A17 有差异,改 jar/overlay 的补丁要按本底包重做(见 survey 结果和本工程 doc/)。
MODS=(
    # 机型身份 / 版本标识
    required/general/bug-fix/identity
    required/general/bug-fix/debug-off

    # 精简(通用脚本 + 各补丁自带 lists/)
    required/tangorpro/tangorpro_graphene_2026110200/slim/pixel-leftovers
    required/general/slim/old-vndk
    required/tangorpro/tangorpro_graphene_2026110200/slim/pixel-hardware
    required/tangorpro/tangorpro_graphene_2026110200/slim/google-apps-min

    # 残留清理:MysticGSI / phh 留下的东西(GrapheneOS 经 MysticGSI 转制后同样会有)
    required/tangorpro/tangorpro_graphene_2026110200/slim/gsi-traces

    # 加固 / 去 GSI 痕迹 / 开机弹窗
    required/tangorpro/tangorpro_graphene_2026110200/bug-fix/selinux/fix
    required/general/bug-fix/gsi-hide
    required/general/bug-fix/build-consistency-dialog-fix

    # 免 root 核心 + 密钥认证引擎 + 机型伪装
    required/general/herald-core
    required/general/attestation-fix
    optional/spoof/global-pif

    # 屏幕显示:亮度、方向、刷新率
    required/general/hardware-fix/auto-brightness-fix
    optional/brightness/hbm-unlimited
    required/tangorpro/rotation-fix
    required/general/hardware-fix/adaptive-refresh-fix
    optional/free-rotation
    optional/smooth-display

    # 系统界面:导航栏、热点入口、overlay 缓存
    required/tangorpro/tangorpro_graphene_2026110200/navbar-hide
    required/tangorpro/hotspot-ui-fix
    optional/overlay-idmap-reset

    # 网络与连接:Wi-Fi(6GHz 国家码 + 频段)、蓝牙
    required/tangorpro/tangorpro_graphene_2026110200/hardware-fix/6ghz-fix
    required/tangorpro/tangorpro_graphene_2026110200/hardware-fix/wifi-apex-assemble
    required/general/hardware-fix/bluetooth-fix

    # 相机
    required/general/hardware-fix/macro-camera-fix
    required/general/camera/pixel-camera

    # 人脸解锁(A17 适配版,GrapheneOS 需按本底包 services.jar 重适配)
    required/tangorpro/tangorpro_graphene_2026110200/faceunlock

    # 32 位 APK(Tango 二进制翻译)
    required/general/tango

    # 收尾:必须排在所有改 framework.jar / services.jar 的补丁后面
    required/general/boot-kernel/stale-boot-image

    # 改 boot 的
    required/general/boot-kernel/kernel-builder-string
    required/general/boot-kernel/boot-assemble

    # 调试(默认都不打)
    debug/shell-logcat
)

# 各补丁的参数
for _c in "$(dirname "${BASH_SOURCE[0]}")"/conf.d/*.conf; do [[ -f $_c ]] && source "$_c"; done
unset _c

# 默认不打(还在目录里,WITH= 或预设可以选上)
MODS_OFF=(
    debug/shell-logcat
    optional/brightness/hbm-unlimited
    optional/overlay-idmap-reset
)

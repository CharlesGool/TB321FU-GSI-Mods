# TB321FU(拯救者 Y700 三代)+ A17 自洽底包 的构建配置。
# 路径都是本机路径;大文件和私有文件不进仓库,放在 NAS 旧工程和 private/ 里。

DEVICE=TB321FU
VERSION=${VERSION:-V1}
# 产物名:<IMAGE_PREFIX>_<版本标签>[_optional][_debug](toolkit/build.sh 按这次选择算)。
# 版本标签用环境变量 VERSION_LABEL(如 user-v1.4),默认取 VERSION 的数字。与 ap3a 同一套命名,对齐 v1.4 标准。
IMAGE_PREFIX=pixelos_tangorpro_cp3a.260905.009

# 数据目录 = tb321fu_pixelos_15_tangorpro_ap3a.241005.015(本仓库是独立项目,和它平级;可用 TB321FU_DATA 覆盖)。
# 目录约定:inputs/(底包、原厂固件、工具)、releases/(各版本成品)、legacy/(早期构建源码、私有 payload)、doc/。
OLD=${TB321FU_DATA:-$(cd "${REPO:?}/../tb321fu_pixelos_15_tangorpro_ap3a.241005.015" && pwd)}
# 签名密钥(AOSP testkey)目录:GSI_SIGNER 优先;数据工程里有 signer/ 就用它;
# 否则回退到 开发/停更/GSI-Signer(仓库拆分后 signer/ 没跟过来,与 ap3a 的解析一致)。
if [[ -n ${GSI_SIGNER:-} ]]; then SIGNER=$GSI_SIGNER
elif [[ -d $OLD/signer ]]; then SIGNER=$OLD/signer
else SIGNER=$(cd "${REPO:?}/../../停更/GSI-Signer" && pwd); fi

# ---- GSI 底包 ----
# Pixel 原厂 CP3A.260905.009(Android 17 / API 37, 2026-09-05)经 MysticGSI(github.com/MysticGSI/mysticgsi 的 cli.py
# build --type pixel)从 factory zip 转成的 raw ext4。factory zip 在 CP3A 项目的 inputs/base/ 下
# (tangorpro-cp3a.260905.009-factory-f1c07024.zip,见 inputs/base/*.sha256)。
# 转换产物存在 CP3A 项目 inputs/base-extracted/(不放 /tmp,避免会话清理丢失);CP3A 项目是 AP3A 项目(=$OLD)的兄弟目录。
# 目录结构与 ap3a 工程一致:inputs/(base、base-extracted)、releases/、doc/。
CP3A_PROJ=$(cd "${REPO:?}/.." && pwd)/tb321fu_pixelos_17_tangorpro_cp3a.260905.009
# MysticGSI 转出(cli.py build cp3a <factory.zip> --type pixel):Android 17 / SDK 37,
# 指纹 google/tangorpro/tangorpro:17/CP3A.260905.009/16091614:user/release-keys,security_patch 2026-09-05。
BASE_GSI=${BASE_GSI:-$CP3A_PROJ/inputs/base-extracted/Pixel-tangorpro-17-16091614-AB-MysticGSI.img}
BASE_GSI_SHA256=26d76396f092a7c3a42fa851c84f8d0d98ae088a07a44b2d466621141b3c13db
# 底包 ID 覆盖:新版 MysticGSI 把 system/build.prop 的 product 泛化成 generic_system_google
# (指纹 google/generic_system_google/generic:17/...),导致 base_id 认成 generic_system_google_… 、
# 所有 required/tangorpro/… 版本门控补丁被判定"不在适用范围"而跳过。这台机器的底包真身就是 Pixel
# Tablet tangorpro CP3A.260905.009(product/system_ext 分区指纹仍是 google/tangorpro/tangorpro),
# 故显式声明真正的底包 ID,让门控正常命中。格式 <product>_<buildid>_<incremental>(小写)。
BASE_ID=tangorpro_cp3a.260905.009_16091614

# ---- 原厂固件(vendor/boot 底包)----
# ZUI 17.0.12.044 OPEN ROW(A15 system + A14 vendor),来自 TB321FU_ZUI_17.0.12_OPEN_9008FACTORY_CRACKED.7z。
# super 里的逻辑分区用 toolkit/flash9008/simsuper.py 切出来。
STOCK_DIR=${STOCK_DIR:-/tmp/9008_super_extract/carved}
STOCK_VENDOR_IMG=$STOCK_DIR/vendor.img
STOCK_SYSTEM_IMG=$STOCK_DIR/system.img
STOCK_FW_DIR=$OLD/inputs/base-fw-a15                 # boot/init_boot/vendor_boot/dtbo/vbmeta/vbmeta_system
STOCK_VBMETA_SYSTEM=$STOCK_FW_DIR/vbmeta_system.img

# ---- 签名 ----
AVBTOOL=${REPO:-.}/toolkit/avb/avbtool.py
AVB_KEY_SYSTEM=$SIGNER/pem/testkey_rsa4096.pem        # 设备信任根就是 AOSP testkey(原厂 OPEN 版也是)
AVB_KEY_VBMETA_SYSTEM=$SIGNER/pem/testkey_rsa2048.pem
# super 里 system_a 的大小(字节)。system 镜像签名后(AVB 补 footer,padding 到这个大小)必须正好这么大,
# 9008 打包时 lp.py 把 super_1 里的 system_a extent 缩到这个值(只能 ≤ 原厂 system_a,放大会和后面分区重叠)。
# 原厂 ZUI system_a = 3702558720 字节(3.45 GiB,lp.py dump 读出,super 总 13 GiB);bp1a 缩到 1882984448
# 是因为 A15 system 小。A17 的 Pixel system(erofs lz4hc ≈ 2.01 GiB)放不进 1.75 GiB,直接用原厂 system_a
# 的完整大小(不缩),留足余量;super 里空间充裕(13 GiB),其它分区不动。
SYSTEM_PART_SIZE=3702558720

# ---- 构建工具 ----
APKTOOL_JAR=${APKTOOL_JAR:-$OLD/legacy/faceunlock/incoming/tools/apktool_2.12.1.jar}
R8_JAR=$OLD/inputs/tools/pif-toolchain/r8.jar
ANDROID_JAR=$OLD/inputs/tools/pif-toolchain/android.jar

# ---- 补丁目录 ----
# MODS 是本设备全部可选的补丁(改 system 的、改 boot 的都在里面),按这个顺序在同一个工作区上执行;名字是 patches/ 下的相对路径。
# 每个补丁的依赖和顺序要求写在它自己的 patches/<名字>/patch.conf 里,构建时会核对这里的顺序。
# 这次打哪些不用改这里:构建时用 PROFILE= / WITH= / WITHOUT= 选(见 README「选补丁」),依赖会自动补上。
# 默认不打的放进下面的 MODS_OFF。
MODS=(
    # 机型身份 / 版本标识
    required/general/bug-fix/identity
    required/general/bug-fix/debug-off              # 关 ADB / 调试,去掉 Mystic 的调试段

    # 精简(通用脚本 + 各补丁自带的 lists/):空间紧,必须的先删
    required/tangorpro/tangorpro_cp3a.260905.009/slim/pixel-leftovers
    required/general/slim/old-vndk
    required/tangorpro/tangorpro_cp3a.260905.009/slim/pixel-hardware       # 只有 Pixel Tablet 的 GSI 才带(底包 ID 以 tangorpro 开头才跑)
    optional/slim/google-apps                    # 通用分级精简:冷门 + 日常 + 助理 + TTS(对应 ap3a GOOGLE_SLIM 的非无障碍部分)
    optional/slim/accessibility                  # 无障碍(TalkBack 等);与 google-apps 合起来 ≈ ap3a GOOGLE_SLIM=3
    required/tangorpro/tangorpro_cp3a.260905.009/bug-fix/dcservice-seapp-fix   # 设备连接服务域修复

    # 残留清理(都是删,腾地方):Mystic 和 phh 留下的东西
    required/tangorpro/tangorpro_cp3a.260905.009/slim/gsi-traces

    # 加固 / 去 GSI 痕迹 / 开机弹窗
    required/tangorpro/tangorpro_cp3a.260905.009/bug-fix/selinux/fix                     # SELinux 修复:system 开机即 Enforcing + boot 内核命令行(两边都改)
    required/general/bug-fix/gsi-hide
    # 注:不打 rw-system-tmpfs —— 目标(phh rw-system.sh 的可写 tmpfs bind)在 CP3A 里是死的嵌套树,已由 gsi-traces 整树删除,无处可修。
    required/general/bug-fix/build-consistency-dialog-fix

    # 免 root 核心(命令通道、配对、插件接口;下面所有 heraldctl 命令的补丁都要求它在前面)+ 密钥认证引擎 + 机型伪装
    required/general/herald-core
    required/general/attestation-fix              # keymint + inject + keybox/RKP/指纹命令
    optional/spoof/global-pif

    # 屏幕显示:亮度、方向、刷新率
    required/general/hardware-fix/auto-brightness-fix
    optional/brightness/hbm-unlimited            # 非常规:手动拉满=面板真峰值,有发热风险;默认不打(MODS_OFF)
    required/tangorpro/rotation-fix
    required/general/hardware-fix/adaptive-refresh-fix   # 自适应刷新率修复(补回原厂 SF 定时器)
    optional/free-rotation                  # 允许竖屏倒过来(180°)的自由旋转(静态 RRO,通用)
    optional/smooth-display       # 设置里"流畅显示"开 = 不设上限、关 = 120Hz(services.jar 钩子)

    # 系统界面:导航栏、热点入口、overlay 缓存
    optional/navbar-hide
    required/tangorpro/hotspot-ui-fix
    optional/overlay-idmap-reset            # 默认不打(MODS_OFF):只在保数据升级后旧 idmap 坏掉时才有用

    # 网络与连接:Wi-Fi(6GHz 国家码 + 频段)、蓝牙
    # hotspot-6ghz-unlock(能力位/信道/设置页三道门)暂不打:清数据首刷时原厂 ZUI 的 WifiRes overlay 生效、框架本就认 6GHz(待真机确认)。
    required/tangorpro/tangorpro_cp3a.260905.009/hardware-fix/6ghz-fix                   # 6GHz 修复:国家码 DE + 选 6GHz 时固定频段
    required/tangorpro/tangorpro_cp3a.260905.009/hardware-fix/wifi-apex-assemble         # Wi-Fi APEX 一次性打包重签,必须排在所有 Wi-Fi 贡献者后面
    required/general/hardware-fix/bluetooth-fix

    # 相机(高通 vendor 兼容要排在相机前面)
    required/general/hardware-fix/macro-camera-fix
    required/general/camera/pixel-camera                    # Pixel 相机(Google 相机 4.4 通用版,APK 用户提供)

    # 人脸解锁(CP3A 适配版:Sense 框架类按 CP3A services.jar 重编,构造器签名/final 方法已照 CP3A 框架改;见该补丁 README)
    required/tangorpro/tangorpro_cp3a.260905.009/faceunlock

    # 32 位 APK(Tango 二进制翻译)
    required/general/tango                         # 32 位 zygote + ABI 等五个部分(要 herald-core 在前面)

    # 收尾:必须排在所有改 framework.jar / services.jar 的补丁后面
    required/general/boot-kernel/stale-boot-image

    # 改 boot 的(打包时出 boot.img;boot-assemble 要排在所有往 boot 登记的补丁后面)
    required/general/boot-kernel/kernel-builder-string
    required/general/boot-kernel/boot-assemble

    # 调试(默认都不打,WITH=debug 一次选上)
    debug/shell-logcat
)


# 各补丁的参数
for _c in "$(dirname "${BASH_SOURCE[0]}")"/conf.d/*.conf; do [[ -f $_c ]] && source "$_c"; done
unset _c

# 默认不打(还在目录里,WITH= 或预设可以选上)
MODS_OFF=(
    debug/shell-logcat                 # 调试用:Enforcing 下 adb 能 logcat;要抓日志时 WITH=debug
    optional/brightness/hbm-unlimited  # 非常规:手动拉满用面板峰值,有发热风险
    optional/overlay-idmap-reset       # 偏调试:只在保数据升级后旧 idmap 坏掉时才有用
)

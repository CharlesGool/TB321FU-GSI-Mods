# bluetooth-fix 和 toolkit/lib/vendorbind.sh 的参数(说明见 patches/required/general/hardware-fix/bluetooth-fix/README.md、toolkit/vendor-bind/README.md)

# 要补丁的 vendor 文件,写 /vendor 下的相对路径。换固件后这两个路径可能变
BT_POLICY_REL=etc/audio/sku_pineapple/audio_policy_configuration.xml
BT_AHAL_REL=lib64/hw/audio.primary.pineapple.so

# vendorbind.sh:补丁文件的默认 SELinux 标签(各模块一般自己指定),和开机脚本的标签
VENDOR_BIND_DEFAULT_LABEL=u:object_r:vendor_file:s0
VENDOR_BIND_EXEC_LABEL=u:object_r:update_engine_exec:s0

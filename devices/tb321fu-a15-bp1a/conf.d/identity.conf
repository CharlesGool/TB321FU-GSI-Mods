# identity/* 和 debug-off 的参数
# product-fields 用: 机型字段
ID_BRAND=Lenovo
ID_DEVICE=TB321FU
ID_MANUFACTURER=Lenovo
ID_MODEL=TB321FU
ID_NAME=TB321FU
# product-fields 用: 底包 GSI 原机代号
GSI_CODENAME=tangorpro          # 底包 GSI 原机代号(ro.build.description 里要换掉的)
# version-label 用: 设置里"版本号"显示的字符串
DISPLAY_ID=TB321FU_Tangorpro_A15_${VERSION}

# build-fingerprint 用: STOCK_SYSTEM_IMG / STOCK_VENDOR_IMG(原厂固件的 system/vendor 镜像),在 device.conf 里定义

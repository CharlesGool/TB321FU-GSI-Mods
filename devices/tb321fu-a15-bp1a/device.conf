# TB321FU(拯救者 Y700 三代)+ A15 自洽底包 的构建配置。
# 路径都是本机路径;大文件和私有文件不进仓库,放在 NAS 旧工程和 private/ 里。

DEVICE=TB321FU
VERSION=V1-BP1A
IMAGE_NAME=Pixel-tangorpro-15_TB321FU_BP1A_${VERSION}_erofs_raw_Signed

# 数据目录 = tb321fu_pixelos_15_tangorpro_ap3a.241005.015(本仓库是独立项目,和它平级;可用 TB321FU_DATA 覆盖)。
# 目录约定:inputs/(底包、原厂固件、工具)、releases/(各版本成品)、legacy/(早期构建源码、私有 payload)、doc/。
OLD=${TB321FU_DATA:-$(cd "${REPO:?}/../tb321fu_pixelos_15_tangorpro_ap3a.241005.015" && pwd)}
SIGNER=${GSI_SIGNER:-$OLD/signer}

# ---- GSI 底包 ----
# Pixel 原厂 BP1A.250505.005(Android 15, 2025-05-05)经 MysticGSI(github.com/MysticGSI/mysticgsi 的 cli.py
# build --type pixel)从 factory zip 转成的 raw ext4。factory zip 在 BP1A 项目的 base/ 下。
# 转换产物存在 BP1A 项目目录(不放 /tmp,避免会话清理丢失);BP1A 项目是 AP3A 项目(=$OLD)的兄弟目录。
BP1A_PROJ=$(cd "${REPO:?}/../.." && pwd)/tb321fu_pixelos_15_tangorpro_bp1a.250505.005
BASE_GSI=${BASE_GSI:-$BP1A_PROJ/base-extracted/Pixel-tangorpro-15-13277524-AB-MysticGSI.img}
BASE_GSI_SHA256=a9888115bd42d4fe0469bad4782106ecc12796503858bf0cc2c1615b16f9394a

# ---- 原厂固件(vendor/boot 底包)----
# ZUI 17.0.12.044 OPEN ROW(A15 system + A14 vendor),来自 TB321FU_ZUI_17.0.12_OPEN_9008FACTORY_CRACKED.7z。
# super 里的逻辑分区用 toolkit/flash9008/simsuper.py 切出来。
STOCK_DIR=${STOCK_DIR:-/tmp/9008_super_extract/carved}
STOCK_VENDOR_IMG=$STOCK_DIR/vendor.img
STOCK_SYSTEM_IMG=$STOCK_DIR/system.img
STOCK_FW_DIR=$OLD/inputs/base-fw-a15                 # boot/init_boot/vendor_boot/dtbo/vbmeta/vbmeta_system
STOCK_VBMETA_SYSTEM=$STOCK_FW_DIR/vbmeta_system.img

# ---- 签名 ----
AVBTOOL=${REPO:-.}/toolkit/avb/avbtool.py
AVB_KEY_SYSTEM=$SIGNER/pem/testkey_rsa4096.pem        # 设备信任根就是 AOSP testkey(原厂 OPEN 版也是)
AVB_KEY_VBMETA_SYSTEM=$SIGNER/pem/testkey_rsa2048.pem
# super 里 system_a 的大小(字节)。system 镜像签名后必须正好这么大(V57 起固定)
SYSTEM_PART_SIZE=1882984448

# ---- 构建工具 ----
APKTOOL_JAR=${APKTOOL_JAR:-$OLD/legacy/faceunlock/incoming/tools/apktool_2.12.1.jar}
R8_JAR=$OLD/inputs/tools/pif-toolchain/r8.jar
ANDROID_JAR=$OLD/inputs/tools/pif-toolchain/android.jar

# ---- 补丁目录 ----
# MODS 是本设备全部可选的补丁(改 system 的、改 boot 的都在里面),按这个顺序在同一个工作区上执行;名字是 patches/ 下的相对路径。
# 每个补丁的依赖和顺序要求写在它自己的 patches/<名字>/patch.conf 里,构建时会核对这里的顺序。
# 这次打哪些不用改这里:构建时用 PROFILE= / WITH= / WITHOUT= 选(见 README「选补丁」),依赖会自动补上。
# 默认不打的放进下面的 MODS_OFF。
MODS=(
    # 机型身份
    required/general/bug-fix/identity
    required/general/bug-fix/debug-off              # 关 ADB / 调试,去掉 Mystic 的调试段

    # 精简(通用脚本 + 各补丁自带的 lists/):空间紧,必须的先删
    required/tangorpro/tangorpro_bp1a.250505.005/slim/pixel-leftovers
    required/general/slim/old-vndk
    required/tangorpro/tangorpro_bp1a.250505.005/slim/pixel-hardware       # 只有 Pixel Tablet 的 GSI 才带这些组件(底包 ID 以 tangorpro 开头才跑)
    optional/slim/google-apps                    # 想留着 Google 应用就别打
    optional/slim/accessibility                  # 需要读屏的别打
    required/tangorpro/tangorpro_bp1a.250505.005/bug-fix/dcservice-seapp-fix   # 设备连接服务域修复(只针对 tangorpro_bp1a.250505.005 这一版,别的版本自动跳过)

    # 残留清理(都是删,系统分区只剩约 22MB 余量,腾地方):旧版 VNDK、没人用的数据、Mystic 和 phh 留下的东西
    required/tangorpro/tangorpro_bp1a.250505.005/slim/gsi-traces

    # 加固 / 去 GSI 痕迹
    required/tangorpro/tangorpro_bp1a.250505.005/bug-fix/selinux/fix                     # SELinux 修复:system 里开机即 Enforcing + boot 内核命令行(两边都改)
    required/general/bug-fix/gsi-hide
    # 注:不打 rw-system-tmpfs —— 它的目标(phh 的 rw-system.sh 那个可写 tmpfs bind)在 BP1A 里是嵌套
    # system/system/bin/rw-system.sh,整个嵌套 shim 树是死的、已由 gsi-traces 整棵删掉,这里没东西可修。

    # 屏幕:自动亮度、亮度曲线、方向
    required/general/hardware-fix/auto-brightness-fix
    optional/brightness/hbm-unlimited            # 手动拉满=面板真峰值;发热风险,不想要就注释掉
    required/tangorpro/rotation-fix

    # 热点入口(设置里、快捷设置里)
    required/tangorpro/hotspot-ui-fix

    # overlay 缓存自愈:开机删我们 overlay 的旧 idmap(V69/V70 的 brightness-curve 因坏 idmap 失效)
    optional/overlay-idmap-reset

    # 蓝牙(两个补丁文件开机时 bind 到 /vendor;bind 机制由 toolkit/lib/vendorbind.sh 在第一次用到时自动装,不是单独的模块)
    required/general/hardware-fix/bluetooth-fix

    # 人脸解锁(默认不打,见 MODS_OFF):Sense 人脸框架钩子源码是对着 AP3A/Mystic 的 services.jar 写的,
    # BP1A(官方 2025-05)里 HalClientMonitor/RemovalClient/AuthenticationClient 的构造器签名和
    # handleFailedAttempt(已 final)都变了,源码要按 BP1A 框架重新适配才能编过。作为后续项,先默认关。
    optional/faceunlock

    # 开机弹窗修复、过期预编译产物清理
    required/general/bug-fix/build-consistency-dialog-fix
    required/general/boot-kernel/stale-boot-image     # 必须排在所有改 framework.jar / services.jar 的模块后面

    # 免 root 核心 + 密钥认证引擎 + 机型伪装,以及挂在核心上的导航栏隐藏(要求 herald-core 在前面;Wi-Fi 的热点命令也挂在核心上,所以核心排在 Wi-Fi 前面)
    required/general/herald-core
    required/general/attestation-fix
    optional/spoof/global-pif
    optional/navbar-hide

    # Wi-Fi 6GHz 热点:国家码 DE + band-fix 已照 BP1A 的 service-wifi.jar 重做并启用。原理同 AP3A
    # (见各自 README);BP1A 的 WifiCountryCode.setTelephonyCountryCode / SoftApManager.startSoftAp
    # 和 AP3A 几乎同构(.locals 相同),只重挂了字段类型(mContext → WifiContext)和上下文行号,
    # 注入块逐字未改,已 patch --fuzz=0 + apktool 回编验证。hotspot-6ghz-unlock(能力位/信道/设置页
    # 三道门)暂不打:按它 README 的 V103 真机结论,清数据首刷时原厂 ZUI 的 WifiRes overlay 生效、
    # 框架本就认 6GHz,不需要这三道门(待真机确认;若 overlay 没生效再启用)。hotspot-control
    # (热点自定义)是后续项。贡献者和 assemble 必须整组一起启用/禁用(单独留贡献者会报没有 assemble)。
    # optional/hotspot-6ghz-unlock
    required/tangorpro/tangorpro_bp1a.250505.005/hardware-fix/6ghz-fix
    # optional/hotspot-control
    required/tangorpro/tangorpro_bp1a.250505.005/hardware-fix/wifi-apex-assemble

    # 改 boot 的(打包时出 boot.img;boot-assemble 要排在所有往 boot 登记的补丁后面)
    required/general/boot-kernel/kernel-builder-string
    required/general/boot-kernel/boot-assemble

    # 调试(默认都不打,WITH=debug 一次选上):排在必须打和可选的后面,可以覆盖前面的结果(可以覆盖前面的结果)
    debug/shell-logcat
)


# 各补丁的参数
for _c in "$(dirname "${BASH_SOURCE[0]}")"/conf.d/*.conf; do [[ -f $_c ]] && source "$_c"; done
unset _c

# 默认不打
MODS_OFF=(
    debug/shell-logcat                 # 调试用:Enforcing 下 adb 能 logcat;要抓日志时 WITH=debug
    optional/faceunlock                # Sense 人脸钩子源码要按 BP1A 框架重新适配才能编过(见上面注释),先不打
)

# identity/* 和 debug-off 的参数
# product-fields 用: 机型字段
ID_BRAND=Lenovo
ID_DEVICE=TB321FU
ID_MANUFACTURER=Lenovo
ID_MODEL=TB321FU
ID_NAME=TB321FU
# product-fields 用: 底包 GSI 原机代号(ro.build.flavor/description 开头的 "<代号>-user")。
# 新版 MysticGSI 把 system/build.prop 泛化成 generic_system_google(product/system_ext 仍是 tangorpro);
# 001.product-fields 读 system/build.prop,所以这里填 generic_system_google。
# 注:ID_KEEP_GSI_OS_VERSION=1 时 002 的 gsi_overlay 会把三份 build.prop 的 flavor/description 统一归一化
# 成 TB321FU-user(保留 A17 版本段),故此值在本线主要供 001 自洽,不影响最终结果。
GSI_CODENAME=generic_system_google
# version-label 用: 设置里"版本号"显示的字符串
DISPLAY_ID=${IMAGE_NAME:-TB321FU_Tangorpro_A17_${VERSION}}

# ---- CP3A 专属:保留 GSI 自带的安卓版本(不谎报成原厂 ZUI 的 Android 15)----
# 背景:原厂固件(STOCK_SYSTEM_IMG)是联想 ZUI 的 Android 15;identity 的 build-fingerprint 部分默认
# 从原厂 system 现取整条指纹和 build 描述符,会把本底包(Pixel 官方 CP3A Android 17 / API 37)的系统
# 版本谎报成 15。CP3A 这条线要求:机型身份(model/brand/product = TB321FU/Lenovo)照常还原,但
# **操作系统版本字段保留 GSI 自带的 Android 17 值**:
#   - ro.build.version.release / release_or_codename / sdk
#   - ro.build.version.security_patch(系统安全补丁级别)
#   - ro.build.id / incremental
#   - ro.*.build.fingerprint 里的版本段(:<release>/<id>/<incremental>:)
# 置 1 时,build-fingerprint 部分不再从原厂镜像现取,而是取 GSI 自带指纹、只把其中的
# brand/product/device 段换成 Lenovo/TB321FU/TB321FU(见
# patches/required/general/bug-fix/identity/parts/002.build-fingerprint/README.md 的「保留 GSI 版本」一节)。
# 默认(不设或 =0)= 原行为(整条指纹从原厂现取),ap3a/bp1a 不受影响。
ID_KEEP_GSI_OS_VERSION=1

# build-fingerprint 用: ID_KEEP_GSI_OS_VERSION=0 时从 STOCK_SYSTEM_IMG / STOCK_VENDOR_IMG 现取
# (原厂固件的 system/vendor 镜像,在 device.conf 里定义);=1 时不读原厂镜像,从 GSI 自带 build.prop 取版本。

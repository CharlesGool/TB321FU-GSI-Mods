# Wi-Fi APEX 那几个补丁(6ghz-fix、hotspot-control、hotspot-6ghz-unlock、wifi-apex-assemble)的参数(说明见 patches/required/tangorpro/tangorpro_ap3a.241005.015/hardware-fix/wifi-apex-assemble/README.md 的"输入"一节)

# 要改的 APEX(system 下的相对路径)。底包里是 .capex 时写 .capex,模块会换成同名 .apex。
# A17 底包里 Wi-Fi APEX 是压缩格式 com.google.android.wifi.capex(bp1a/ap3a 是未压缩 .apex)。
WIFI_APEX_FILE=apex/com.google.android.wifi.capex

# payload 的 AVB 私钥。重签后 apex_pubkey 换成它的公钥。这台机器用 AOSP testkey_rsa4096
WIFI_APEX_AVB_KEY=$SIGNER/pem/testkey_rsa4096.pem
WIFI_APEX_AVB_ALGORITHM=SHA256_RSA4096

# 外层 APEX(zip)的 APK 签名 key。用的是 AOSP 的 testkey(build/make/target/product/security/testkey.*)
# 这两个文件不进仓库。/tmp 下的会在重启后丢,丢了从 AOSP 源码树或 9008 包工作目录再拷一份
WIFI_APEX_CERT_X509=${WIFI_APEX_CERT_X509:-$REPO/private/aosp-testkey/testkey.x509.pem}
WIFI_APEX_CERT_PK8=${WIFI_APEX_CERT_PK8:-$REPO/private/aosp-testkey/testkey.pk8}

# bluetooth-fix(DP11 版)和 toolkit/lib/vendorbind.sh 的参数(说明见 patches/required/tangorpro/tangorpro_dp11.261016.003/hardware-fix/bluetooth-fix/README.md、toolkit/vendor-bind/README.md)

# 要补丁的 vendor 文件,写 /vendor 下的相对路径。换固件后这两个路径可能变(DP11 版不再改音频策略,没有 BT_POLICY_REL)
BT_AHAL_REL=lib64/hw/audio.primary.pineapple.so
BT_LE_LATENCY_REL=lib64/btaudio_offload_if.so

# vendorbind.sh:补丁文件的默认 SELinux 标签(各模块一般自己指定),和开机脚本的标签
VENDOR_BIND_DEFAULT_LABEL=u:object_r:vendor_file:s0
VENDOR_BIND_EXEC_LABEL=u:object_r:update_engine_exec:s0

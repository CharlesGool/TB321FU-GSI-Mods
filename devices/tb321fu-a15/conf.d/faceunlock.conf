# faceunlock/* 的参数(说明见 patches/required/tangorpro/tangorpro_ap3a.241005.015/faceunlock/README.md 和各模块 README 的"输入"一节)
# 用到它们的模块:services-hooks(FU_D2J/FU_R8/FU_JAVA_HOME);app 和 settings-entry 装 files/ 下本地编好的 APK(不进仓库),
# 编 APK 时才用 FACEUNLOCK_KEYSTORE。

# faceunlock/services-hooks:services.jar 里 Sense 框架类的编译工具链(apply.sh 构建时用)。apktool 走公共的 APKTOOL_JAR。
FU_D2J=$OLD/legacy/faceunlock/incoming/tools/dex-tools-2.4.38/d2j-dex2jar.sh   # dex2jar 2.4.38
# r8.jar(含 D8)。用 8.5.35(V66 建 classes4.dex 用的就是它)能和 V66 逐字节一致;换新版 r8(如
# pif-toolchain 的 8.13)产物语义相同、只是 d8 codegen 不同导致字节不同。见 faceunlock/services-hooks/README.md 的"换底包注意"。
FU_R8=$OLD/legacy/faceunlock/incoming/tools/r8.jar                            # r8 8.5.35
FU_JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64                        # JDK 17

# faceunlock/app 和 faceunlock/settings-entry 编 APK 时才用(镜像装的是各自 files/ 下本地编好的 APK):
# 签名 keystore(alias faceunlock, 口令 android)。不进仓库,放 paranoidsense-gsi-port 里。
FACEUNLOCK_KEYSTORE=$OLD/../paranoidsense-gsi-port/sense/faceunlock.keystore

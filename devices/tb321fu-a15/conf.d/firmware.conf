# 原厂固件侧(boot 补丁、主 vbmeta 重签 avb_resign)和 9008 刷机包的参数。
# 改 boot 的补丁和别的补丁一样在 toolkit/build.sh 里按 MODS 顺序执行,模块说明见
# docs/topics/boot.md、docs/AVB-RESIGN.md;9008 刷机包见 toolkit/flash9008/README.md、docs/FLASH-9008.md。
# 用到 device.conf 前面定义的 OLD、SIGNER、STOCK_DIR、STOCK_FW_DIR、STOCK_VBMETA_SYSTEM、DEVICE、VERSION。

# ---- 签名 ----
# 主 vbmeta 和 boot 都是 testkey_rsa4096 签的(设备信任根),vbmeta_system 是 testkey_rsa2048(见 device.conf)
AVB_KEY_VBMETA=$SIGNER/pem/testkey_rsa4096.pem

# ---- boot(boot-assemble 和它的贡献者 selinux/kernel-enforcing、kernel-builder-string)----
FW_BOOT_STOCK=$STOCK_FW_DIR/boot.img                 # boot-assemble 读的原厂 boot,sha256 c65d8313…
FW_BOOT_CMDLINE="enforcing=1 selinux=1"              # selinux/kernel-enforcing
FW_BOOT_KBUILD_FROM=build-user@build-host            # kernel-builder-string(FROM、TO 必须一样长)
FW_BOOT_KBUILD_TO=androidbld@abfarmhost
# SALT / DROP_DUP_PROPS 给 boot-assemble 用。下面两项只为了和 V47 起真机在用的那颗 boot(276324c4…)逐字节一样,让用户刷机目录里已有的 boot.img
# 还能按 sha256 被认出来。V47 那次用的是随机 salt、并且去掉了原厂 footer 里重复的一条 security_patch 属性。
# 换了原厂 boot 就把这两项清空(FW_BOOT_SALT= FW_BOOT_DROP_DUP_PROPS=0),同时清空 FW_BOOT_EXPECT_SHA256。
# FW_BOOT_EXPECT_SHA256 只在改 boot 的补丁是默认那套时对得上;构建时去掉了其中一个,toolkit/build.sh 会自动跳过 boot 的核对。
FW_BOOT_SALT=08a8b98b9fefde9b17439c0df98ec68bbaeea754e9485a3c73f62c05a0c2cfb9
FW_BOOT_DROP_DUP_PROPS=1
FW_BOOT_EXPECT_SHA256=276324c4a27e2028b719c26d0f1fcb208ac1c8b887293b0cfdabf22857ae22ec

# ---- 主 vbmeta 重签(toolkit/avb_resign.sh main)----
FW_VBMETA_STOCK=$STOCK_FW_DIR/vbmeta.img             # 原厂 vbmeta,sha256 bf0fa2aa…(钉的是没改地区的 vendor_boot)
# 主 vbmeta 里每个 descriptor 对应的分区文件。hash 分区按这些文件重算摘要;hashtree 分区核对 footer;
# chain 分区核对签名公钥。boot 不用写,模块自动用刚生成的补丁 boot($FW_OUT/boot.img)。
FW_VBMETA_IMAGES=(
    dtbo=$STOCK_FW_DIR/dtbo.img
    init_boot=$STOCK_FW_DIR/init_boot.img
    vendor_boot=$STOCK_FW_DIR/vendor_boot.img
    odm=$STOCK_DIR/odm.img
    system_dlkm=$STOCK_DIR/system_dlkm.img
    vendor=$STOCK_DIR/vendor.img
    vendor_dlkm=$STOCK_DIR/vendor_dlkm.img
    vbmeta_system=$STOCK_VBMETA_SYSTEM
)
FW_VBMETA_EXPECT_SHA256=c30043ec2bdb8db2edabda052ca2d2d2fbfb237230295a1248b2921914f366f3

# ---- 9008 刷机包 ----
# 原厂 9008 包(TB321FU_ZUI_17.0.12_OPEN_9008FACTORY_CRACKED.7z)image/ 解出来的位置,按顺序找文件。
# 要有:super_1..8.img、rawprogram1..5.xml、dtbo.img;有 pvmfw.img/recovery.img 的话 AVB 核对会更全。
FLASH9008_STOCK_DIRS=(${FLASH9008_STOCK_DIRS:-/tmp/9008_super_extract/image /tmp/9008_inspect/image})
# 保数据的 LUN0 XML 基准:必须是真机刷过、确认没清数据的那份(V49 起一直用它,V51 换错基准清过数据)
FLASH9008_BASE_XML=$OLD/inputs/base-fw-a15/rawprogram_save_persist_unsparse0_v49.xml
# system 增量补丁的基准 = 用户刷机目录里现有的最新一版 image\super_4_vNN.img(现在是 V129,即 user-v1.2)。
# 用户刷了新版本后,把这三行改成新版本,下一个补丁就是"上一版 → 下一版"。补丁名里会带上源文件和合成后的文件名。
# 窗口:xdelta3 -B,默认 512MiB(FLASH9008_XDELTA_WINDOW 可改)。
FLASH9008_BASE_VERSION=129
FLASH9008_BASE_IMAGE=$OLD/inputs/base-images/super_4_v129.img
FLASH9008_BASE_SHA256=5b1da8f2a6ccf389d8e6fedb1f69fb3389e6dd8eb6d39fd112c1f3d802277f9b
# Windows 版 xdelta3(第三方二进制,不进仓库)
FLASH9008_XDELTA_EXE=$OLD/inputs/tools/xdelta3.exe
# boot 集(boot/init_boot/vendor_boot/vbmeta)和用户已有的一样就不带;换固件或改了 boot 补丁时设成 1
FLASH9008_INCLUDE_BOOT_SET=0

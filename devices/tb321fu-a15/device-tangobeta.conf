# Tango 测试版(V883:V88 + Tango 五个补丁,关掉 WALT-BUG)的构建配置 = 主配置 device.conf + 下面的覆盖。
# 以前这里是 device.conf 的整份副本;补丁目录和顺序现在跟主配置走,这里只写不一样的地方。
source "$(dirname "${BASH_SOURCE[0]}")/device.conf"

VERSION=V883
IMAGE_NAME=Pixel-tangorpro-15_TB321FU_${VERSION}_erofs_raw_Signed

# 测试版的选择:当时还没上真机验证的不带;主配置后来默认不打的高级功能(游戏模式、性能调节、rexec、HBM)测试版是带的。
# 所以这里整个重写 MODS_OFF,不用主配置的。
MODS_OFF=(
    debug/herald-zygisk-timing-probe debug/diag-boot-camera-log
    optional/statusbar-netspeed optional/devopts-hide optional/custom-font optional/app-backup
)

# 9008 增量基准:V882

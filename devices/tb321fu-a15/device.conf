# TB321FU(拯救者 Y700 三代)+ A15 自洽底包 的构建配置。
# 路径都是本机路径;大文件和私有文件不进仓库,放在 NAS 旧工程和 private/ 里。

DEVICE=TB321FU
VERSION=${VERSION:-V105}
# 相机三选一:zui=联想相机(可用微距,删了不可用功能) pixel=Pixel 相机(默认,无微距) none=都不装。构建时 CAMERA=zui make 9008 …
CAMERA=${CAMERA:-pixel}
# 全局改机型用 optional/spoof/global-pif(运行时 resetprop + 挂载盖 build.prop 保持文件和属性一致,
# 见该补丁 README);原来 optional/spoof/device-spoof 的 build/setprop/mount 三种做法和 global-pif
# 功能重复(尤其挂载这种,global-pif 自己就有),已经删掉。
# Google 应用精简级别:0 不精简 1 冷门(默认) 2 再加日常应用 3 再加无障碍(TalkBack)
GOOGLE_SLIM=${GOOGLE_SLIM:-1}
export GOOGLE_SLIM
# 产物名(system 镜像、releases 下的目录):<IMAGE_PREFIX>_v<版本号>,选了 optional/ 下的补丁加 _optional,选了 debug/ 下的加 _debug,
# 两种都选是 _optional_debug,只有 required 的构建没有后缀(toolkit/build.sh 按这次的选择算,结果写进 system/IMAGE_NAME)。
IMAGE_PREFIX=pixelos_tangorpro_ap3a.241005.015

# 工程根目录 = 本仓库的上一级(tb321fu_pixelos_15_tangorpro_ap3a.241005.015)。
# 目录约定:inputs/(底包、原厂固件、工具)、releases/(各版本成品)、legacy/(早期构建源码、私有 payload)、doc/。
OLD=${TB321FU_DATA:-$(cd "${REPO:?}/../tb321fu_pixelos_15_tangorpro_ap3a.241005.015" && pwd)}
SIGNER=${GSI_SIGNER:-$OLD/signer}

# ---- GSI 底包 ----
# Mystic GSI(Pixel Tablet tangorpro, Android 15 AP3A.241005.015, 2024-10-19),zip 里 out/tangorpro/ 下的 raw ext4。
# zip 在 $OLD/inputs/base/,解出来的 img 放哪都行(2026-11-01:之前指向某个会话 /tmp scratchpad 下的解包副本,
# 会话清理/磁盘紧张时被截断过一次,改成放项目自己的 inputs/base-extracted/,不再依赖任何会话临时目录)。
BASE_GSI=${BASE_GSI:-$OLD/inputs/base-extracted/out/tangorpro/Pixel-tangorpro-15-12366759-AB-20241019-MysticGSI.img}
BASE_GSI_SHA256=7148ed4589abdfd146452b80a0626ad8c362e2bb9ffcc90c44c3adde8a85166d

# ---- 原厂固件(vendor/boot 底包)----
# ZUI 17.0.12.044 OPEN ROW(A15 system + A14 vendor),来自 TB321FU_ZUI_17.0.12_OPEN_9008FACTORY_CRACKED.7z。
# super 里的逻辑分区用 toolkit/flash9008/simsuper.py 切出来。
STOCK_DIR=${STOCK_DIR:-/tmp/9008_super_extract/carved}
STOCK_VENDOR_IMG=$STOCK_DIR/vendor.img
STOCK_SYSTEM_IMG=$STOCK_DIR/system.img
STOCK_FW_DIR=$OLD/inputs/base-fw-a15                 # boot/init_boot/vendor_boot/dtbo/vbmeta/vbmeta_system
STOCK_VBMETA_SYSTEM=$STOCK_FW_DIR/vbmeta_system.img

# ---- 签名 ----
AVBTOOL=${REPO:-.}/toolkit/avb/avbtool.py
AVB_KEY_SYSTEM=$SIGNER/pem/testkey_rsa4096.pem        # 设备信任根就是 AOSP testkey(原厂 OPEN 版也是)
AVB_KEY_VBMETA_SYSTEM=$SIGNER/pem/testkey_rsa2048.pem
# super 里 system_a 的大小(字节)。system 镜像签名后必须正好这么大(V57 起固定)
SYSTEM_PART_SIZE=1882984448

# ---- 构建工具 ----
APKTOOL_JAR=${APKTOOL_JAR:-$OLD/legacy/faceunlock/incoming/tools/apktool_2.12.1.jar}
R8_JAR=$OLD/inputs/tools/pif-toolchain/r8.jar
ANDROID_JAR=$OLD/inputs/tools/pif-toolchain/android.jar

# ---- 补丁目录 ----
# MODS 是本设备全部可选的补丁(改 system 的、改 boot 的都在里面),按这个顺序在同一个工作区上执行;名字是 patches/ 下的相对路径。
# 每个补丁的依赖和顺序要求写在它自己的 patches/<名字>/patch.conf 里,构建时会核对这里的顺序。
# 这次打哪些不用改这里:构建时用 PROFILE= / WITH= / WITHOUT= 选(见 README「选补丁」),依赖会自动补上。
# 默认不打的放进下面的 MODS_OFF。
MODS=(
    # 机型身份 / 版本标识
    required/general/bug-fix/identity
    required/general/bug-fix/debug-off              # 关 ADB / 调试,去掉 Mystic 的调试段

    # 精简(通用脚本 + 各补丁自带的 lists/):空间紧,必须的先删
    required/tangorpro/tangorpro_ap3a.241005.015/slim/pixel-leftovers
    required/general/slim/old-vndk
    required/tangorpro/tangorpro_ap3a.241005.015/slim/pixel-hardware       # 只有 Pixel Tablet 这一版 GSI 才带(底包 ID 以 tangorpro_ap3a.241005.015 开头才跑)
    required/tangorpro/tangorpro_ap3a.241005.015/slim/google-slim   # 分级精简 Google 应用,GOOGLE_SLIM=0|1|2|3,默认 1
    required/tangorpro/tangorpro_ap3a.241005.015/bug-fix/dcservice-seapp-fix   # 设备连接服务域修复(只针对 tangorpro_ap3a.241005.015 这一版,别的版本自动跳过)

    # 残留清理(都是删,系统分区只剩约 22MB 余量,腾地方)
    required/tangorpro/tangorpro_ap3a.241005.015/slim/gsi-traces

    # 加固 / 去 GSI 痕迹 / 开机弹窗
    required/tangorpro/tangorpro_ap3a.241005.015/bug-fix/selinux/fix                     # SELinux 修复:system 里开机即 Enforcing + boot 内核命令行(两边都改)
    required/general/bug-fix/gsi-hide
    required/tangorpro/tangorpro_ap3a.241005.015/bug-fix/rw-system-tmpfs
    required/general/bug-fix/build-consistency-dialog-fix

    # 免 root 核心(命令通道、配对、插件接口;下面所有 heraldctl 命令的补丁都要求它在前面)+ 密钥认证引擎 + 机型伪装
    required/general/herald-core
    required/general/attestation-fix              # keymint + inject + keybox/RKP/指纹命令(原来内置在核心里,现在是接入核心的一个补丁)
    optional/spoof/global-pif
    optional/spoof/app-spoof                   # 按 App 伪装(默认模式,系统属性不动,相机不再崩);heraldctl spoofmode app|global 切换

    # 屏幕显示:亮度、方向、刷新率
    required/general/hardware-fix/auto-brightness-fix
    optional/brightness/hbm-unlimited        # 非常规:手动拉满=面板真峰值,有发热风险;默认不打,要的话 WITH=brightness/hbm-unlimited
    required/tangorpro/rotation-fix
    required/general/hardware-fix/adaptive-refresh-fix   # 自适应刷新率修复(补回原厂 SF 定时器)
    optional/refresh-control              # 刷新率控制:heraldctl refresh 锁定/限定
    optional/free-rotation                  # 允许竖屏倒过来(180°)的自由旋转;rotation-fix 是必选的 bug 修复,这个只管允许哪几个方向
    optional/smooth-display       # 设置里"流畅显示"开 = 165Hz、关 = 120Hz(services.jar 钩子)
    optional/refresh-auto-switch          # 默认不打(MODS_OFF):按前台应用/低电量自动换刷新率

    # 系统界面:导航栏、热点入口、overlay 缓存
    optional/navbar-hide
    required/tangorpro/hotspot-ui-fix
    optional/overlay-idmap-reset

    # 电池(heraldctl battery …)
    optional/battery

    # 游戏模式(heraldctl game …)
    optional/game-mode

    # 性能调节(heraldctl perf …;node-access 在前,profiles 在 cpu-freq 后面,game-boost 在 game-mode 和 profiles 后面)
    optional/perf
    optional/perf-game-boost

    # 网络与连接:Wi-Fi(几个贡献者 + 一个 assemble)、蓝牙、状态栏网速
    optional/hotspot-6ghz-unlock
    required/tangorpro/tangorpro_ap3a.241005.015/hardware-fix/6ghz-fix                          # 6GHz 修复:国家码 DE + 选 6GHz 时固定频段
    optional/hotspot-control               # 热点自定义 + heraldctl wifi|hotspot
    required/tangorpro/tangorpro_ap3a.241005.015/hardware-fix/wifi-apex-assemble                # Wi-Fi APEX 一次性打包重签,必须排在所有 Wi-Fi 贡献者后面
    required/general/hardware-fix/bluetooth-fix
    optional/statusbar-netspeed

    # 相机(高通 vendor 兼容要排在 zuicamera 前面)
    required/general/hardware-fix/macro-camera-fix
    required/general/camera/zuicamera                       # 相机三选一(CAMERA=zui):联想相机 + 它在 GSI 上的修补
    required/general/camera/pixel-camera                    # 相机三选一(CAMERA=pixel,默认):Google 相机 4.4(Pixel 相机通用版),APK 用户提供

    # 人脸解锁
    optional/faceunlock

    # 隐私 / 个性化 / 备份(都改 framework.jar 或挂 herald 后端)
    optional/devopts-hide
    optional/custom-font
    optional/app-backup              # heraldctl backup app|restore|list|delete|job(apk 含 split + 数据备份到指定目录;要 herald-core 在前面)

    # 32 位 APK(Tango 二进制翻译;V93 合回主线,见 doc/tango-research.md)
    required/general/tango                         # 32 位 zygote + ABI 等五个部分;带崩溃保护(heraldctl tango status|retry|off)

    # 诊断(默认不打,查问题时 WITH=diag-boot-camera-log)

    # 调试(默认都不打,WITH=debug 一次选上):排在必须打和可选的后面,可以覆盖前面的结果(可以覆盖前面的结果)
    debug/shell-logcat
    debug/adb-on-boot
    debug/rooted-adbd
    debug/herald-readonly-shell
    debug/herald-rooted-shell
    debug/herald-zygisk-timing-probe
    debug/herald-zygisk-fork-observer
    debug/diag-boot-camera-log

    # 收尾:必须排在所有改 framework.jar / services.jar 的补丁后面
    required/general/boot-kernel/stale-boot-image     # 必须排在所有改 framework.jar / services.jar 的模块后面(含 spoof/app-spoof)

    # 改 boot 的(打包时出 boot.img;boot-assemble 要排在所有往 boot 登记的补丁后面)
    required/general/boot-kernel/kernel-builder-string
    required/general/boot-kernel/boot-assemble
)

# 默认不打的(还在目录里,WITH= 或预设可以选上)
MODS_OFF=(
    debug/shell-logcat                 # 调试用:Enforcing 下 adb 能 logcat;要抓日志时 WITH=debug
    optional/refresh-auto-switch                # 按前台应用/低电量自动换刷新率,没必要,自己要再选
    debug/herald-zygisk-timing-probe            # 调研用
    debug/herald-zygisk-fork-observer            # 调研用
    debug/diag-boot-camera-log               # 诊断用,查完就不要了
    optional/overlay-idmap-reset                # 偏调试:只在保数据升级后旧 idmap 坏掉时才有用
    required/general/boot-kernel/stale-boot-image                   # 不单独打:选了改 framework.jar / services.jar 的补丁会自动带上(它们的 WANTS)
    optional/brightness/hbm-unlimited           # 非常规:手动拉满用面板峰值,有发热风险
    # 高级 / 非原生功能,用户自己选(WITH=…)
    optional/app-backup optional/custom-font optional/devopts-hide optional/statusbar-netspeed optional/game-mode optional/perf optional/perf-game-boost
    debug/adb-on-boot debug/rooted-adbd debug/herald-readonly-shell debug/herald-rooted-shell optional/spoof/app-spoof optional/spoof/global-pif
)


# 各补丁的参数
for _c in "$(dirname "${BASH_SOURCE[0]}")"/conf.d/*.conf; do [[ -f $_c ]] && source "$_c"; done
unset _c

# 补丁身份文件,bash 语法,会被 source。真正的补丁里的 patch.conf 不写注释,字段说明都在这个模板里。
# 选补丁、自动补依赖、核对顺序、make list、补丁总表全都读它,所以依赖和顺序要求只写在这里。

# 补丁名 = patches/ 下的文件夹路径:required/general/名字(通用修复)、required/<底包前缀>/名字(特定底包限定,如 required/tangorpro/名字,构建时只有底包 ID 命中才跑)、optional/名字(可选)、debug/名字(调试用)
NAME=__NAME__
# 补丁版本号,格式 V<数字>.<数字>,可带后缀(如 V1.0-test)。新建补丁从 V1.0 起。
# 每次改这个补丁(它目录下任何文件)都要更新版本号,无论是否正常工作——方便用 git 管理、区分每次改动;
# test-patch-meta 会对着 git HEAD 查:补丁有改动但 VERSION 没升就报错。
VERSION=V1.0
# 中文名,几个字,表格和 make list 里显示
TITLE='中文名'
# 一句话说明,make list 和补丁总表里显示
DESC='一句话说明这个补丁做什么'
# 改哪边:system | firmware | both(只是说明,执行顺序看 device.conf 的 MODS)
STAGE=system
# 必须一起打,并且排在本补丁前面(没选会自动带上)。挂在 herald核心 上的写 (required/general/herald-core);要写全名
REQUIRES=(required/general/herald-core)
# 只管顺序:这些如果也打了,要排在本补丁前面(不选也行)
AFTER=()
# 只管顺序:这些如果也打了,要排在本补丁后面
BEFORE=()
# 软依赖:选了本补丁就顺带打上它们;被明确去掉也不连累本补丁(改 jar 的补丁写 (required/general/boot-kernel/stale-boot-image))
WANTS=()
# 往哪些产物登记改动,会自动带上负责它的 assemble 补丁
CONTRIBUTES=()
# 负责把哪些产物收到的登记一次性打上(assemble 补丁才有)
ASSEMBLES=()
# 装好后在设备上怎么开关;空 = 只能构建时选
RUNTIME='heraldctl 命令 子命令'
# 可能的问题(可选,大部分补丁不需要这一行):已知的副作用、可能被检测到的地方、没在真机验证过的部分
#RISKS='一两句话'
# 只对 optional/* 有意义(可选,不写就是 on):make-9008.sh 向导问"要吗?"时的默认答案。
#   仍然会问,只是 off 时默认答案是 n。off 要和 device.conf 的 MODS_OFF 对得上(toolkit/tests/test-patch-meta.sh 会查)
#DEFAULT=off

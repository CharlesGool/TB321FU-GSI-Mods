NAME=required/general/hardware-fix/vibrator-hal
VERSION=V1.2
TITLE='双马达振动 HAL'
DESC='系统侧 IVibratorManager/default(tb321fu-vibrator,herald 域):直接走两颗 Awinic 马达的 input force-feedback,框架认出 2 个马达,支持 primitives / 组合振动 / 同步振动;vendor 的 IVibrator 不动'
STAGE=system
REQUIRES=(required/general/herald-core)
AFTER=(required/general/herald-core)
BEFORE=()
CONTRIBUTES=()
ASSEMBLES=()
RUNTIME='setprop persist.tb321fu.vibrator.{gain_max,ramps,motors,f0_dhz}'
RISKS='VINTF 声明了 IVibratorManager/default,system_server 开机会等它注册:服务起不来就卡在开机动画(二进制、rc、VINTF 三件必须一起装)'

NAME=required/general/hardware-fix/cover-rotation-fix
VERSION=V1.1
TITLE='皮套合盖灭屏 + 边缘防误触跟随旋转'
DESC='services.jar 加 Tb321fuHwPolicy(挂在 PhoneWindowManager.systemReady 末尾):监听高通霍尔传感器上报合盖/开盖(合盖灭屏、开盖亮屏);转屏时调联想触摸 HAL setEdgeInhibition,让边缘防误触跟随方向'
STAGE=system
REQUIRES=()
AFTER=(required/tangorpro/tangorpro_dp11.261016.003/faceunlock required/tangorpro/tangorpro_bp1a.250505.005/faceunlock required/tangorpro/tangorpro_cp3a.260905.009/faceunlock required/tangorpro/tangorpro_graphene_2026110200/faceunlock)
BEFORE=(required/general/boot-kernel/stale-boot-image)
WANTS=(required/general/boot-kernel/stale-boot-image)
CONTRIBUTES=()
ASSEMBLES=()
RUNTIME=''
RISKS='改 services.jar(只换 PhoneWindowManager 所在的那份 dex + 新增一份 dex);helper 全程 try/catch,最坏情况只是功能不生效。合盖后打不开:settings put global tb321fu_cover_enabled 0'

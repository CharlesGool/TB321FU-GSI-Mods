NAME=required/general/hardware-fix/dt2w
VERSION=V1.0
TITLE='双击唤醒'
DESC='双击唤醒:herald 插件开机把 config_supportDoubleTapWake 打成 true(设置里出现"点按唤醒"),并把 Secure.double_tap_to_wake 同步到 Novatek 触摸的 /proc/gesture_control'
STAGE=system
REQUIRES=(required/general/herald-core)
AFTER=(required/general/herald-core)
BEFORE=()
CONTRIBUTES=()
ASSEMBLES=()
RUNTIME='heraldctl dt2w on|off|status'
RISKS='灭屏时触摸控制器停在手势模式,待机功耗略增;没有 /proc/gesture_control 的设备上插件不做事'

NAME=required/general/hardware-fix/torch-levels
VERSION=V1.4
TITLE='手电筒档位'
DESC='手电筒亮度滑块真正生效:vendor 相机 HAL 忽略档位(固定两颗各 75 mA)、亮着改档还会关掉第二颗灯;常驻小 App 监听 TorchCallback 写最新状态文件,herald 用 inotify 读到后按档位重写 PMIC 闪光灯节点(默认 1~3 档单颗 50/100/200 mA,4 档两颗各 300 mA)'
STAGE=system
REQUIRES=(required/general/herald-core)
AFTER=(required/general/herald-core)
BEFORE=()
CONTRIBUTES=()
ASSEMBLES=()
RUNTIME='setprop persist.tb321fu.torch.l1..l4 <颗数>x<mA>;heraldctl raw torch status'
RISKS='4 档两颗各 300 mA(原厂只有 2 x 75)会更热,长时间开着注意温度;vendor 相机 HAL 的温控是否还会接管未验证'

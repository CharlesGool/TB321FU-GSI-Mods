NAME=optional/devopts-hide
VERSION=V1.0
TITLE='开发者选项隐藏'
DESC='按 App 隐藏开发者选项 / ADB 状态:framework.jar 里加类 + 四处钩子,名单里的 App 读这几项设置得到 0;heraldctl hide devopts 管开关、模式和名单,改完重启生效'
STAGE=system
REQUIRES=(required/general/herald-core)
AFTER=()
BEFORE=(required/general/boot-kernel/stale-boot-image)
WANTS=(required/general/boot-kernel/stale-boot-image)
CONTRIBUTES=()
ASSEMBLES=()
RUNTIME='heraldctl hide devopts on|off|mode|add|remove'
DEFAULT=off

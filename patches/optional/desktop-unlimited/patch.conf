NAME=optional/desktop-unlimited
VERSION=V1.0
TITLE='桌面模式不限应用数'
DESC='去掉 Android 17 桌面模式最多同时开 4 个应用的限制(persist.wm.debug.desktop_max_task_limit=0)'
STAGE=system
REQUIRES=()
AFTER=()
BEFORE=()
CONTRIBUTES=()
ASSEMBLES=()
RUNTIME='adb/heraldctl: setprop persist.wm.debug.desktop_max_task_limit <N> 后重启;0 = 不限'
RISKS='开很多窗口时内存压力大,后台应用会被系统杀;DESKTOP_MAX_TASKS=N 可改成固定上限'

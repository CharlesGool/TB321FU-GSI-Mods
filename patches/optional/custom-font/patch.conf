NAME=optional/custom-font
VERSION=V1.0
TITLE='自定义字体'
DESC='自定义系统字体:SystemFonts 改读 /data/fonts/herald/ 的字体包(不挂载、不占 system)+ heraldctl 装包/选用/撤回'
STAGE=system
REQUIRES=(required/general/herald-core)
AFTER=()
BEFORE=(required/general/boot-kernel/stale-boot-image)
WANTS=(required/general/boot-kernel/stale-boot-image)
CONTRIBUTES=()
ASSEMBLES=()
RUNTIME='heraldctl font install|use|reset|list'
DEFAULT=off

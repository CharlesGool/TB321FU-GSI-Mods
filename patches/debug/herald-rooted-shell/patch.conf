NAME=debug/herald-rooted-shell
VERSION=V1.0
TITLE='root shell'
DESC='经 herald broker 以 root 跑任意命令(经 sh -c,支持管道和重定向),默认关、限时打开、只接受命令行;不需要 debug/adb 的免授权和 ro.debuggable'
STAGE=system
REQUIRES=(required/general/herald-core)
AFTER=()
BEFORE=()
CONTRIBUTES=()
ASSEMBLES=()
RUNTIME='heraldctl rsh on|off,默认关'

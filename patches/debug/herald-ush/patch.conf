STAGE=system
REQUIRES=(required/general/herald-core)
AFTER=()
BEFORE=()
WANTS=()
CONTRIBUTES=()
ASSEMBLES=()
RUNTIME='adb shell ush <命令>(装上即用,不限时)'
RISKS='装上即对能 adb shell(uid 2000,需 USB 调试授权)的人无门槛开放 root,只放调试版;命令跑在 herald 域(permissive)'
